<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Masterclasses | César Franck International Piano Competition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600;1,700&family=Outfit:wght@200;300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest: #1B2A27;
            --copper: #D4A373;
            --sage: #7D8B7A;
            --parchment: #F2F0E9;
            --dusty-white: #EAE8E1;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--parchment);
            color: var(--forest);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .serif { font-family: 'Cormorant Garamond', serif; }
        
        .page-section { display: block; animation: sectionFade 0.6s ease-out; }

        @keyframes sectionFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-link {
            letter-spacing: 0.12em;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--forest);
            transition: all 0.3s ease;
            cursor: pointer;
            padding: 1.5rem 0;
            display: flex;
            align-items: center;
            white-space: nowrap;
            text-decoration: none;
        }
        .nav-link:hover { color: var(--copper); }

        .dropdown-container { position: relative; }
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--parchment);
            border: 1px solid rgba(27, 42, 39, 0.1);
            min-width: 220px;
            display: none;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            z-index: 1000;
            padding: 0.75rem 0;
        }

        @media (min-width: 1024px) {
            .dropdown-container:hover .dropdown-menu { display: block; animation: fadeIn 0.3s ease; }
        }
        
        .dropdown-menu.is-visible { display: block !important; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translate(-50%, 10px); } 
            to { opacity: 1; transform: translate(-50%, 0); } 
        }

        .dropdown-item {
            display: block;
            padding: 0.8rem 1.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--forest);
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            width: 100%;
        }
        .dropdown-item:hover { 
            background: var(--forest); 
            color: var(--copper); 
        }

        #mobile-nav-overlay {
            position: fixed;
            inset: 0;
            background: var(--forest);
            z-index: 2000;
            display: none;
            flex-direction: column;
            padding: 4rem 2rem;
            overflow-y: auto;
            color: var(--parchment);
        }
        #mobile-nav-overlay.open { display: flex; animation: overlayIn 0.4s ease forwards; }
        
        @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

        .mobile-group { margin-bottom: 2.5rem; }
        .mobile-label { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-style: italic; color: var(--copper); margin-bottom: 0.5rem; display: block; border-bottom: 1px solid rgba(212, 163, 115, 0.2); }
        .mobile-link { display: block; padding: 0.75rem 0; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.8; width: 100%; text-align: left; background: none; border: none; color: inherit; text-decoration: none; }

        .brand-logo {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        
        .logo-image {
            height: 100px;
            width: auto;
            object-fit: contain;
            transition: height 0.3s ease;
        }
        
        @media (min-width: 768px) {
            .logo-image { height: 150px; }
        }

        .bg-forest { background-color: var(--forest) !important; }
        .text-copper { color: var(--copper) !important; }
        .btn-copper { background-color: var(--copper); color: white; transition: all 0.3s ease; }
        .btn-copper:hover { background-color: var(--forest); }

        .prof-card-container {
            overflow: hidden;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .prof-card-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .prof-image {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            background-color: var(--dusty-white);
        }
        .prof-info {
            background-color: var(--forest);
            padding: 2rem;
            text-align: center;
            color: var(--copper);
        }

        .shadow-box-beige {
            background-color: #F2F0E9;
            padding: 3rem;
            border-radius: 2px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            border: 1px solid rgba(27, 42, 39, 0.05);
            height: 100%;
        }

        .social-circle-footer {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1.5px solid var(--copper);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--copper);
            transition: all 0.3s ease;
            text-decoration: none;
            background: transparent;
        }
        .social-circle-footer:hover {
            background-color: var(--copper);
            color: var(--forest);
        }
        .social-circle-footer svg { width: 22px; height: 22px; }

        /* Custom Floating Language Widget Styling */
        .lang-widget-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 9999;
        }
        .lang-toggle-btn {
            background-color: var(--forest);
            color: var(--copper);
            border: 1.5px solid var(--copper);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-toggle-btn:hover {
            background-color: var(--copper);
            color: var(--forest);
            transform: scale(1.05);
        }
        .lang-dropdown-menu {
            position: absolute;
            bottom: 65px;
            right: 0;
            background: var(--parchment);
            border: 1px solid rgba(212, 163, 115, 0.3);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            border-radius: 4px;
            padding: 0.5rem 0;
            display: none;
            min-width: 150px;
        }
        .lang-dropdown-menu.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }
        .lang-option {
            display: block;
            width: 100%;
            padding: 0.6rem 1rem;
            text-align: left;
            background: none;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--forest);
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-option:hover {
            background: var(--forest);
            color: var(--copper);
        }
    </style>
</head>
